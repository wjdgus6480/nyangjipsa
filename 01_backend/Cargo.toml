[package]
name = "nyangjipsa-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
default-run = "nyangjipsa-api"   # cargo run = API 서버, 수집은 cargo run --bin collect
description = "동물병원 지도 서비스 백엔드 (Axum + SQLx + PostGIS)"

[dependencies]
# 웹 서버
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }

# 데이터베이스 (PostgreSQL + PostGIS). 공간 처리는 SQL에서 하고 Rust는 f64 경도/위도만 사용
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "macros",
    "migrate",
    "derive",
    "uuid",
    "chrono",
] }

# 공공데이터 API 호출 (rustls TLS: sqlx와 같은 aws-lc-rs 암호화 구현 사용)
# form: 카카오 로그인 토큰 교환(application/x-www-form-urlencoded)
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "query",
    "form",
    "charset",
    "http2",
] }

# 회원 인증: 비밀번호 Argon2id, 토큰 SHA-256 해시·base64url, 사용자 id UUID, 시각
argon2 = "0.5"
# OS 난수(OsRng): 솔트와 세션·인증 토큰 생성
password-hash = { version = "0.5", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# 인증·비밀번호 재설정 메일 발송 (SMTP, rustls + aws-lc-rs: reqwest·sqlx 와 같은 TLS 구현)
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "pool",
    "hostname",
    "tokio1",
    "tokio1-rustls",
    "aws-lc-rs",
    "rustls-platform-verifier",
] }

# 직렬화
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 진료비 xlsx 읽기 (import_fees)
calamine = "0.38.0"

# 설정 / 로그 / 오류
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
