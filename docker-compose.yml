# 로컬 개발용 PostgreSQL 18 + PostGIS 3.7
# 실행 (03_vet-map 폴더에서):  docker compose up -d
# 주의: "docker compose down -v" 는 DB 데이터 볼륨을 삭제하므로 사용하지 않습니다.
name: vet-map

services:
  db:
    image: postgis/postgis:18-3.7
    container_name: vet-map-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env 에 POSTGRES_USER 가 필요합니다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 가 필요합니다}
      POSTGRES_DB: ${POSTGRES_DB:?.env 에 POSTGRES_DB 가 필요합니다}
      TZ: Asia/Seoul
    ports:
      # 127.0.0.1 에만 열어서 같은 네트워크의 다른 기기에서는 접속할 수 없게 합니다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 이미지부터 데이터는 /var/lib/postgresql/18/docker 에 저장되므로
      # 상위 폴더 /var/lib/postgresql 을 볼륨에 연결합니다.
      - vet_map_pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: 초기화 중 임시 서버(소켓 전용)가 아닌 실제 서버가 뜬 뒤에만 healthy
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  vet_map_pgdata:
    name: vet_map_pgdata
